    <main class="container" style="padding: 4rem 0;">
      <h1>Online rezervácia</h1>
      <p style="margin-top: 0.5rem;">Vyberte si službu a termín, ozveme sa vám s potvrdením.</p>

      <form style="margin-top: 2rem; display: grid; gap: 1rem; max-width: 450px;">
        <label>
          Meno a priezvisko:<br />
          <input type="text" required style="width: 100%; padding: 0.5rem; margin-top: 0.25rem;" />
        </label>
        <label>
          Telefónne číslo:<br />
          <input type="tel" required style="width: 100%; padding: 0.5rem; margin-top: 0.25rem;" />
        </label>
        <label>
          Služba:<br />
          <select style="width: 100%; padding: 0.5rem; margin-top: 0.25rem;">
            <option>Ošetrenie pleti</option>
            <option>Obočie</option>
            <option>Mihalnice</option>
          </select>
        </label>
        <label>
          Preferovaný dátum:<br />
          <input type="date" required style="width: 100%; padding: 0.5rem; margin-top: 0.25rem;" />
        </label>
        <button type="submit" class="button" style="cursor: pointer;">Odoslať rezerváciu</button>
      </form>
    </main>
