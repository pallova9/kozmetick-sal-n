<!DOCTYPE html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Kozmetický salón — zvýraznite svoju prirodzenú krásu."
    />
    <title>Kozmetický salón</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="#uvod" aria-label="Logo — úvodná stránka">LOGO</a>

        <button
          class="menu-toggle"
          type="button"
          aria-label="Otvoriť menu"
          aria-controls="site-nav"
          aria-expanded="false"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>

        <nav class="site-nav" id="site-nav" aria-label="Hlavná navigácia">
          <a href="#uvod">O nás</a>
          <a href="#sluzby">Cenník</a>
          <a href="#rezervacia">Rezervácia</a>
          <a href="#galeria">Fotogaléria</a>
          <a class="nav-cta" href="#rezervacia">Objednať sa</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero container" id="uvod" aria-labelledby="hero-title">
        <div class="hero-visual">
          <div class="hero-copy">
            <h1 id="hero-title">Zvýraznite svoju prirodzenú krásu</h1>
          </div>
          <span class="hero-orb hero-orb-one" aria-hidden="true"></span>
          <span class="hero-orb hero-orb-two" aria-hidden="true"></span>
        </div>

        <div class="booking-action" id="rezervacia">
          <a class="button" href="#sluzby">Online rezervácia</a>
        </div>
      </section>

      <section class="categories container" id="sluzby" aria-label="Služby salónu">
        <div class="category-grid" id="galeria">
          <article class="category-card category-skin">
            <div class="category-art" aria-hidden="true"></div>
            <h2>Pleť</h2>
          </article>
          <article class="category-card category-brows">
            <div class="category-art" aria-hidden="true"></div>
            <h2>Obočie</h2>
          </article>
          <article class="category-card category-lashes">
            <div class="category-art" aria-hidden="true"></div>
            <h2>Mihalnice</h2>
          </article>
        </div>
      </section>
    </main>

    <footer class="contact container" id="kontakt">
      <p>
        <span>Kontakt: Vlčince, Žilina</span>
        <span class="contact-divider" aria-hidden="true">|</span>
        <span>Otváracie hodiny: Po-Pi 8:00 - 17:00</span>
      </p>
    </footer>
  </body>
</html>
