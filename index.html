    <link rel="stylesheet" href="styles.css" />

    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="index.html" aria-label="Kozmetický salón — úvodná stránka">
  <img src="favicon.jpg" alt="Kozmetický salón" class="brand-logo" />
</a>

        <button
          class="menu-toggle"
          type="button"
          aria-label="Otvoriť menu"
          aria-controls="site-nav"
          aria-expanded="false"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>

        <nav class="site-nav" id="site-nav" aria-label="Hlavná navigácia">
          <a href="o-nas.html">O nás</a>

          <a class="nav-cta" href="rezervacia.html">Objednať sa</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero container" id="uvod" aria-labelledby="hero-title">
        <div class="hero-visual">
          <div class="hero-copy">
            <h1 id="hero-title">Zvýraznite svoju prirodzenú krásu</h1>
          </div>
          <span class="hero-orb hero-orb-one" aria-hidden="true"></span>
          <span class="hero-orb hero-orb-two" aria-hidden="true"></span>
        </div>

        <div class="booking-action" id="rezervacia">
          <svg class="hero-svg" viewBox="0 0 120 120" width="120" height="120" aria-hidden="true" fill="none">
  <circle cx="60" cy="60" r="46" stroke="currentColor" stroke-width="1.5" opacity="0.35" />
  <path d="M60 24 C74 44, 74 76, 60 96 C46 76, 46 44, 60 24 Z" stroke="currentColor" stroke-width="1.5" opacity="0.6" />
  <circle cx="60" cy="60" r="6" fill="currentColor" opacity="0.45" />
</svg>
          <a class="button" href="rezervacia.html">Online rezervácia</a>
        </div>
      </section>

      <section class="categories container" id="sluzby" aria-label="Služby salónu">
        <div class="category-grid" id="galeria">
          <article class="category-card category-skin">
            <div class="category-art" aria-hidden="true"></div>
<h2 class="section-heading">
  <svg class="heading-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none">
    <path d="M12 3.5 C12 3.5 6 10.5 6 14.5 C6 17.8 8.7 20.5 12 20.5 C15.3 20.5 18 17.8 18 14.5 C18 10.5 12 3.5 12 3.5 Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
  </svg>
  <span>Pleť</span>
</h2>
          </article>
          <article class="category-card category-brows">
            <div class="category-art" aria-hidden="true"></div>
            <h2>Obočie</h2>
          </article>
          <article class="category-card category-lashes">
            <div class="category-art" aria-hidden="true"></div>
            <h2>Mihalnice</h2>
          </article>
        </div>
      </section>
    </main>

    <footer class="contact container" id="kontakt">
      <p>
        <span>Kontakt: Vlčince, Žilina</span>
        <span class="contact-divider" aria-hidden="true">|</span>
        <span>Otváracie hodiny: Po-Pi 8:00 - 17:00</span>
      </p>
    </footer>
